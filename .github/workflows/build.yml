name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.fincontrol.app --project-name fincontrol_pro --platforms android
          
      - name: Restore main.dart and pubspec
        run: |
          # Mantém os seus arquivos principais caso já estejam na raiz
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi
          
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
